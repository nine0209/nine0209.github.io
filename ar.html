<!doctype html>
<html lang="th">
<!-- Single-file example: upload only ar.html to GitHub Pages / an HTTPS host.
     CSS, application JS and marker pattern data are embedded in this file.
     A-Frame, AR.js, camera calibration and epona.glb load from public URLs.
     Open https://aitutorialcourse.github.io/tracker.png on another screen
     or print it. Live physical-camera tracking has not been tested.
     Resize model: change fit-and-play="width: 1.8" below. -->
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Epona · AR.js · Single-file example</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: system-ui, Tahoma, sans-serif; }
    #info { position: fixed; z-index: 10; top: 12px; left: 12px; right: 12px;
      max-width: 440px; padding: 12px 16px; border-radius: 10px;
      background: #101820e8; color: white; font-size: 14px; line-height: 1.6; }
    #status { margin: 4px 0; }
    a { color: #a9eaff; }
    #credit { position: fixed; z-index: 10; bottom: 10px; left: 12px; right: 12px;
      width: fit-content; padding: 6px 10px; background: #101820d9; color: white;
      border-radius: 6px; font-size: 11px; }
  </style>
  <!-- Load these in order: A-Frame → AR.js library → our small application. -->
  <script src="https://cdn.jsdelivr.net/npm/aframe@1.6.0/dist/aframe-master.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.8/aframe/build/aframe-ar.js"></script>
  <script>
/* Epona AR example. Open ar.html over HTTPS (e.g. GitHub Pages).
   This is application code; the AR.js library is loaded separately in HTML. */
(() => {
  let found = false;
  let loaded = false;
  let error = '';

  function showStatus() {
    const status = document.getElementById('status');
    if (!status) return;
    status.textContent = error || (!loaded
      ? 'กำลังโหลดโมเดลประมาณ 24 MB… โปรดรอสักครู่'
      : found ? 'พบ marker — กำลังแสดง Epona' : 'โมเดลพร้อมแล้ว — ส่องกล้องไปที่ marker');
  }

  if (window.AFRAME) {
    // Automatically fit the model to the marker and play its first animation.
    AFRAME.registerComponent('fit-and-play', {
      schema: { width: { default: 1.8 } },
      init() {
        this.mixer = null;
        this.el.addEventListener('model-loaded', event => {
          const model = event.detail.model;
          const THREE = AFRAME.THREE;
          model.updateMatrixWorld(true);
          const box = new THREE.Box3().setFromObject(model);
          const size = box.getSize(new THREE.Vector3());
          const center = box.getCenter(new THREE.Vector3());

          // Center X/Z, put feet on Y=0, then scale using the outer entity.
          model.position.x -= center.x;
          model.position.y -= box.min.y;
          model.position.z -= center.z;
          const scale = this.data.width / Math.max(size.x, size.y, size.z, 0.001);
          this.el.object3D.scale.setScalar(scale);

          if (model.animations && model.animations.length) {
            this.mixer = new THREE.AnimationMixer(model);
            this.mixer.clipAction(model.animations[0]).play();
          }
          loaded = true;
          showStatus();
        });
        this.el.addEventListener('model-error', () => {
          error = 'โหลด epona.glb ไม่สำเร็จ ตรวจสอบอินเทอร์เน็ตแล้วรีเฟรชหน้า';
          showStatus();
        });
      },
      tick(time, deltaMs) {
        // Run only while the parent marker is visible. The clip loops by default.
        if (this.mixer && this.el.parentEl.object3D.visible) {
          this.mixer.update(Math.min(deltaMs / 1000, 0.1));
        }
      },
      remove() {
        if (this.mixer) {
          this.mixer.stopAllAction();
          this.mixer.uncacheRoot(this.mixer.getRoot());
        }
      }
    });
  }

  window.addEventListener('camera-error', () => {
    error = 'เปิดกล้องไม่ได้: อนุญาตการใช้กล้อง และเปิดหน้าเว็บผ่าน HTTPS';
    showStatus();
  });

  document.addEventListener('DOMContentLoaded', () => {
    const marker = document.getElementById('marker');
    marker.addEventListener('markerFound', () => { found = true; showStatus(); });
    marker.addEventListener('markerLost', () => { found = false; showStatus(); });

    if (!window.isSecureContext || !navigator.mediaDevices) {
      error = 'ต้องเปิดผ่าน HTTPS เช่น GitHub Pages หรือ localhost เพื่อใช้กล้อง';
    } else if (!window.AFRAME || !AFRAME.systems.arjs) {
      error = 'โหลด A-Frame หรือ AR.js ไม่สำเร็จ ตรวจสอบอินเทอร์เน็ตแล้วรีเฟรชหน้า';
    }
    showStatus();


  });
})();

  </script>
</head>

    <a href="https://aitutorialcourse.github.io/tracker.png" target="_blank" rel="noopener">เปิดภาพ marker</a>
